kind: Features
body: Add `require_location_root` behavior flag (default true) that raises a compiler
  error when a table materialization does not specify `location_root`. This ensures
  all tables are created at explicit storage locations. Disable with
  `require_location_root: false` in dbt_project.yml flags.
