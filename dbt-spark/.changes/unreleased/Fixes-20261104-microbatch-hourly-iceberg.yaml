kind: Fixes
body: Mark newly created Iceberg incremental relations as Iceberg in the relation cache so later microbatch batches in the same run (e.g. hourly batches partitioned by hours(event_time)) use Iceberg INSERT OVERWRITE syntax instead of failing with a partition clause syntax error.
