kind: Features
body: Add post-creation syncing of `tblproperties` for Iceberg tables. On incremental
  merge runs dbt computes a structural diff between the model config and the existing
  table properties, issuing `ALTER TABLE SET TBLPROPERTIES` for new/changed keys and
  `ALTER TABLE UNSET TBLPROPERTIES` for removed keys. Properties prefixed with `polaris_`
  are automatically excluded from comparison and sync.
