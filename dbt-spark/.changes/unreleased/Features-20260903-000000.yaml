kind: Features
body: |
  Add a `streaming` materialization for SQL and Python models in local Spark sessions. SQL streaming models read every declared ref and source through Structured Streaming temporary views, while Python models return a streaming DataFrame. Streaming models create their sink table with DataFrameWriterV2, synchronize Iceberg table properties and persisted comments on reruns, and can wait for completion with the `await_termination` behavior flag or model config. Configure checkpoint storage with `checkpoint_basedir` or `DBT_STREAMING_CHECKPOINT_BASEDIR`. Iceberg streaming models can configure fanout, nullability, ordering, and snapshot metadata with validated `write_stream_options`; `stream_options` has been renamed. Configure validated Iceberg incremental table reads with `read_stream_options`, which applies to every dbt-managed streaming ref and source. Both option maps are supported only by streaming models.
