kind: Features
body: |
  Add a Python-only `streaming` materialization for local Spark sessions. Streaming models create their sink table with DataFrameWriterV2, synchronize Iceberg table properties and persisted comments on reruns, and can wait for completion with the `await_termination` behavior flag or model config. Configure checkpoint storage with `checkpoint_basedir` or `DBT_STREAMING_CHECKPOINT_BASEDIR`. Iceberg streaming models can configure fanout, nullability, ordering, and snapshot metadata with `stream_options`; changes take effect when dbt starts a new stream.
time: 2026-09-03T00:00:00.000000-08:00
