kind: Features
body: Add partition drift detection for Iceberg incremental merge models. Two new flags
  (`check_partition_sync` and `check_partition_sync_raises`) compare the model's configured
  partition transform expressions against the existing table spec fetched via `SHOW
  CREATE TABLE`. When a mismatch is detected dbt logs a warning or raises an error
  depending on flag configuration.
